[project]
name = "01-doc-loader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aditya", email = "adityau5090@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "jq>=1.13.0",
    "langchain-community>=0.4.2",
    "onnxruntime>=1.31.1",
    "pdfminer-six>=20260107",
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "pypdf>=7.0.1",
    "pytesseract>=0.3.13",
    "rapidocr>=3.10.0",
]

[project.scripts]
01-doc-loader = "_01_doc_loader:main"

[tool.uv.build-backend]
module-name = "_01_doc_loader"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
